<div class="proposalRow">
    <span class="proposalRow__kind js-kind"></span>
    <div class="proposalRow__body">
        <div class="proposalRow__headline">
            <span class="proposalRow__taskTitle js-taskTitle"></span>
            <span class="proposalRow__change js-change"></span>
        </div>
        <div class="proposalRow__reason js-reason" hidden></div>
    </div>
    <div class="proposalRow__actions">
        <button type="button" class="proposalRow__btn --apply js-applyBtn">Apply</button>
        <button type="button" class="proposalRow__btn js-rejectBtn">Reject</button>
    </div>
</div>
