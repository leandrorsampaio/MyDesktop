<!-- Always visible. The only permanent entry point to the assistant. -->
<button type="button" class="assistant__launcher js-launcher" aria-label="Open assistant" aria-expanded="false">
    <svg-icon icon="lightning" size="24"></svg-icon>
    <span class="assistant__launcherBadge js-pending" hidden></span>
</button>

<div class="assistant__panel js-panel" role="dialog" aria-label="Assistant" hidden>
    <header class="assistant__header">
        <span class="assistant__context js-context">Assistant</span>
        <button type="button" class="assistant__iconBtn js-clearBtn" title="Clear conversation" aria-label="Clear conversation">⌫</button>
        <button type="button" class="assistant__iconBtn js-closeBtn" title="Close" aria-label="Close assistant">&times;</button>
    </header>

    <div class="assistant__messages js-messages"></div>

    <div class="assistant__notice js-notice" hidden></div>

    <div class="assistant__composer">
        <textarea class="assistant__input js-input" rows="1"
                  placeholder="Ask about your board…" aria-label="Message the assistant"></textarea>
        <button type="button" class="assistant__sendBtn js-sendBtn">Send</button>
    </div>
    <div class="assistant__usage js-usage"></div>
</div>
