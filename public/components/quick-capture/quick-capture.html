<div class="quickCapture__backdrop js-captureBackdrop"></div>
<div class="quickCapture__bar" role="dialog" aria-label="Quick capture">
    <svg-icon class="quickCapture__icon" icon="lightning" size="16"></svg-icon>
    <input
        type="text"
        class="quickCapture__input js-captureInput"
        placeholder="What needs doing?"
        aria-label="Capture a note"
        autocomplete="off"
        spellcheck="false"
    />
    <kbd class="quickCapture__kbd">Enter</kbd>
</div>
<div class="quickCapture__hint js-captureHint" hidden></div>
