<div class="taskCard__epicBar js-epicBar" style="display: none;"></div>
<div class="taskCard__body">
    <div class="taskCard__content">
        <div class="taskCard__header">
            <span class="taskCard__star" style="display: none;">★</span>
            <span class="taskCard__title js-title"></span>
            <span class="taskCard__points js-points" style="display: none;"></span>
        </div>
        <div class="taskCard__desc js-desc"></div>
        <span class="taskCard__badge js-badge" style="display: none;"></span>
        <span class="taskCard__needsFiling js-needsFiling" style="display: none;" title="Captured — not yet filed">unfiled</span>
        <span class="taskCard__attachments js-attachments" style="display: none;">
            <svg-icon icon="paperclip" size="12"></svg-icon><span class="js-attachmentCount"></span>
        </span>
        <div class="taskCard__deadline js-deadline" style="display:none;"></div>
    </div>
    <button class="taskCard__editBtn">Edit</button>
</div>
<!-- Preview footer: only rendered while the board is in preview mode -->
<div class="taskCard__preview js-previewBar" style="display: none;">
    <span class="taskCard__previewNote js-previewNote"></span>
    <span class="taskCard__previewActions">
        <button type="button" class="taskCard__previewBtn --accept js-previewAccept" title="Apply this change">✓</button>
        <button type="button" class="taskCard__previewBtn --reject js-previewReject" title="Reject this change">✕</button>
    </span>
</div>
